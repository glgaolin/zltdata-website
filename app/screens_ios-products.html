<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>泽雷特 · 产品中心</title>
<style>
  :root {
    --blue: #0D47A1; --cyan: #27C3C4; --dark: #142824;
    --bg: #F4F6F8; --surface: #FFFFFF; --fg: #1A1A2E;
    --muted: #6B7280; --border: #E5E7EB;
    --danger: #E53935; --warning: #FB8C00; --success: #43A047;
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    max-width: 430px; margin: 0 auto; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .status-bar { display: flex; justify-content: space-between; padding: 14px 24px 8px; font-size: 12px; font-weight: 600; background: var(--blue); color: #fff; }
  .nav-bar { display: flex; align-items: center; gap: 12px; padding: 12px 24px 16px; background: var(--blue); color: #fff; border-radius: 0 0 20px 20px; }
  .nav-bar .back { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 18px; display: grid; place-items: center; cursor: pointer; }
  .nav-bar h1 { font-size: 18px; font-weight: 700; }
  /* Search */
  .search-bar { margin: 16px 24px; display: flex; gap: 8px; }
  .search-bar input { flex: 1; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 24px; font-size: 14px; background: var(--surface); font-family: inherit; }
  .search-bar button { width: 44px; height: 44px; border-radius: 50%; background: var(--cyan); color: #fff; border: none; font-size: 18px; cursor: pointer; }
  /* Category Grid */
  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 24px 16px; }
  .cat-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 12px; background: var(--surface); border-radius: var(--radius); border: none; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.04); transition: transform .15s; text-align: center; }
  .cat-card:active { transform: scale(.96); }
  .cat-card .icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; }
  .cat-icon-1 { background: #E3F2FD; } /* 机柜 */
  .cat-icon-2 { background: #E0F7FA; } /* 空调 */
  .cat-icon-3 { background: #FCE4EC; } /* 配电 */
  .cat-icon-4 { background: #FFF3E0; } /* UPS */
  .cat-icon-5 { background: #E8F5E9; } /* 动环 */
  .cat-icon-6 { background: #F3E5F5; } /* 布线 */
  .cat-icon-7 { background: #EFEBE9; } /* 电池 */
  .cat-card .name { font-size: 13px; font-weight: 700; }
  .cat-card .count { font-size: 11px; color: var(--muted); }
  /* Featured Section */
  .section { padding: 8px 24px 0; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; }
  .section-title .more { font-size: 13px; color: var(--cyan); }
  .product-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .product-card { min-width: 200px; background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
  .product-card .img-placeholder { height: 120px; background: linear-gradient(135deg, #E3F2FD, #BBDEFB); display: grid; place-items: center; font-size: 40px; }
  .product-card .info { padding: 12px; }
  .product-card .name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .product-card .spec { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .product-card .inquiry-btn { display: inline-block; padding: 6px 14px; background: var(--cyan); color: #fff; border: none; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }
  /* Inquiry Form */
  .inquiry-form { padding: 0 24px 20px; display: none; }
  .inquiry-form.active { display: block; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px; font-family: inherit; background: var(--surface); color: var(--fg);
  }
  .form-group textarea { height: 80px; resize: vertical; }
  .form-row { display: flex; gap: 8px; }
  .form-row .form-group { flex: 1; }
  .submit-inquiry { width: 100%; padding: 14px; background: var(--cyan); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; cursor: pointer; }
  /* Tab Bar */
  .tab-bar { position: sticky; bottom: 0; display: flex; justify-content: space-around; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0)); max-width: 430px; margin: 0 auto; }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); border: none; background: none; cursor: pointer; padding: 4px 12px; }
  .tab-item.active { color: var(--blue); }
  .tab-icon { font-size: 22px; }
</style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span style="display:flex;gap:6px">●●●●○</span></div>
  <div class="nav-bar">
    <button class="back" onclick="history.back()">←</button>
    <h1>产品中心</h1>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <input type="text" placeholder="搜索产品型号...">
    <button>🔍</button>
  </div>

  <!-- Category Grid -->
  <div class="cat-grid">
    <button class="cat-card" onclick="scrollToCat('cabinet')">
      <div class="icon cat-icon-1">🗄️</div>
      <div class="name">服务器机柜</div>
      <div class="count">32款产品</div>
    </button>
    <button class="cat-card" onclick="scrollToCat('ac')">
      <div class="icon cat-icon-2">❄️</div>
      <div class="name">精密空调</div>
      <div class="count">18款产品</div>
    </button>
    <button class="cat-card">
      <div class="icon cat-icon-3">⚡</div>
      <div class="name">配电系统</div>
      <div class="count">12款产品</div>
    </button>
    <button class="cat-card">
      <div class="icon cat-icon-4">🔋</div>
      <div class="name">模块化UPS</div>
      <div class="count">15款产品</div>
    </button>
    <button class="cat-card">
      <div class="icon cat-icon-5">📡</div>
      <div class="name">动环监控</div>
      <div class="count">8款产品</div>
    </button>
    <button class="cat-card">
      <div class="icon cat-icon-6">🔌</div>
      <div class="name">综合布线</div>
      <div class="count">20款产品</div>
    </button>
    <button class="cat-card">
      <div class="icon cat-icon-7">🪫</div>
      <div class="name">蓄电池组</div>
      <div class="count">10款产品</div>
    </button>
  </div>

  <!-- Featured Products -->
  <div class="section">
    <div class="section-title">热门产品<span class="more">全部产品 →</span></div>
    <div class="product-row">
      <div class="product-card">
        <div class="img-placeholder">🗄️</div>
        <div class="info">
          <div class="name">智能一体柜 ZLT-SC</div>
          <div class="spec">42U · 单柜 · 含空调/UPS/配电/动环</div>
          <button class="inquiry-btn" onclick="showInquiry('智能一体柜 ZLT-SC')">在线询价</button>
        </div>
      </div>
      <div class="product-card">
        <div class="img-placeholder" style="background:linear-gradient(135deg,#E0F7FA,#B2EBF2)">❄️</div>
        <div class="info">
          <div class="name">列间精密空调 ZLT-AC</div>
          <div class="spec">25kW · 列间 · 变频 · R410A</div>
          <button class="inquiry-btn" onclick="showInquiry('列间精密空调 ZLT-AC')">在线询价</button>
        </div>
      </div>
      <div class="product-card">
        <div class="img-placeholder" style="background:linear-gradient(135deg,#E8F5E9,#C8E6C9)">📡</div>
        <div class="info">
          <div class="name">DCIM动环监控平台</div>
          <div class="spec">3D可视化 · 手机APP · 2000+测点</div>
          <button class="inquiry-btn" onclick="showInquiry('DCIM动环监控平台')">在线询价</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Inquiry Form -->
  <div class="inquiry-form" id="inquiryForm">
    <div class="section" style="padding-top:12px">
      <div class="section-title" style="margin-bottom:16px">在线询价</div>
      <div class="form-group">
        <label>意向产品</label>
        <input type="text" id="inquiryProduct" readonly placeholder="请从热门产品中选择">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>您的姓名</label>
          <input type="text" placeholder="请输入姓名">
        </div>
        <div class="form-group">
          <label>联系电话</label>
          <input type="tel" placeholder="请输入电话">
        </div>
      </div>
      <div class="form-group">
        <label>公司名称</label>
        <input type="text" placeholder="请输入公司名称">
      </div>
      <div class="form-group">
        <label>需求数量</label>
        <select>
          <option>1-5台</option>
          <option>5-20台</option>
          <option>20-50台</option>
          <option>50台以上</option>
          <option>仅咨询</option>
        </select>
      </div>
      <div class="form-group">
        <label>备注说明</label>
        <textarea placeholder="请描述您的具体需求，如规格、用途、时间要求等..."></textarea>
      </div>
      <button class="submit-inquiry" onclick="submitInquiry()">提交询价</button>
    </div>
  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-item" onclick="location.href='screens_ios-dashboard.html'"><span class="tab-icon">🏠</span> 首页</button>
    <button class="tab-item" onclick="location.href='screens_ios-alarms.html'"><span class="tab-icon">🔔</span> 告警</button>
    <button class="tab-item" onclick="location.href='screens_ios-tickets.html'"><span class="tab-icon">📋</span> 工单</button>
    <button class="tab-item active" onclick="location.href='screens_ios-products.html'"><span class="tab-icon">📦</span> 产品</button>
    <button class="tab-item" onclick="location.href='screens_ios-profile.html'"><span class="tab-icon">👤</span> 我的</button>
  </nav>

  <script>
    function showInquiry(productName) {
      document.getElementById('inquiryForm').classList.add('active');
      document.getElementById('inquiryProduct').value = productName;
      document.getElementById('inquiryForm').scrollIntoView({ behavior: 'smooth' });
    }
    function submitInquiry() {
      var name = document.querySelector('#inquiryForm input[placeholder="请输入姓名"]').value;
      var phone = document.querySelector('#inquiryForm input[placeholder="请输入电话"]').value;
      var company = document.querySelector('#inquiryForm input[placeholder="请输入公司名称"]').value;
      if (!name || !phone) { alert('请至少填写姓名和联系电话'); return; }
      alert('询价已提交！\n\n产品：' + document.getElementById('inquiryProduct').value + '\n联系人：' + name + '\n电话：' + phone + '\n公司：' + (company || '未填写') + '\n\n我们的销售经理将在24小时内联系您。\n或直接致电：18603311919');
    }
    function scrollToCat(cat) {
      var cats = { cabinet: '服务器机柜', ac: '精密空调', power: '配电系统', ups: '模块化UPS', dcim: '动环监控', cabling: '综合布线', battery: '蓄电池组' };
      var name = cats[cat] || cat;
      alert('已选择分类：' + name + '\n\n该分类下产品详情请查看桌面版产品手册。\n完整产品规格请联系：18603311919');
    }
    // 搜索功能
    document.querySelector('.search-bar button').addEventListener('click', function() {
      var kw = document.querySelector('.search-bar input').value.trim();
      if (!kw) { alert('请输入搜索关键词'); return; }
      alert('搜索：' + kw + '\n\n在线产品搜索功能开发中。\n如需查询产品，请直接致电：18603311919');
    });
  </script>
</body>
</html>
