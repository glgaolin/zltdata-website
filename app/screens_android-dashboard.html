<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>泽雷特运维 · Android</title>
<style>
  :root {
    --blue: #0D47A1; --cyan: #27C3C4; --dark: #142824;
    --bg: #F4F6F8; --surface: #FFFFFF; --fg: #1A1A2E;
    --muted: #6B7280; --border: #E5E7EB;
    --danger: #E53935; --warning: #FB8C00; --success: #43A047; --info: #1E88E5;
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', 'Noto Sans SC', system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    max-width: 430px; margin: 0 auto; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  /* Android Status Bar */
  .status-bar { display: flex; justify-content: space-between; padding: 10px 20px 6px; font-size: 12px; background: var(--dark); color: #fff; }
  /* Top App Bar (Material) */
  .top-bar { background: var(--blue); color: #fff; padding: 8px 16px 12px; border-radius: 0 0 16px 16px; }
  .top-bar h1 { font-size: 20px; font-weight: 500; font-family: 'Roboto', sans-serif; display: flex; align-items: center; gap: 8px; }
  .top-bar .site-tag { font-size: 12px; opacity: .8; margin-top: 2px; }
  .top-bar .avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; }
  .top-bar .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  /* Stats Row (Material chips) */
  .stat-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 16px; margin-top: -12px; }
  .chip { background: var(--surface); border-radius: 12px; padding: 14px 8px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .chip .num { font-size: 20px; font-weight: 500; font-family: 'Roboto', sans-serif; }
  .chip .label { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }
  /* Quick Actions - Material icons */
  .actions { display: flex; gap: 8px; padding: 16px; overflow-x: auto; }
  .action-chip { display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--surface); border-radius: 28px; border: 1px solid var(--border); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .action-chip .icon { font-size: 18px; }
  /* Section */
  .section { padding: 8px 16px 16px; }
  .section-title { font-size: 14px; font-weight: 500; color: var(--fg); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }
  /* Alert Cards */
  .alert-card { display: flex; gap: 12px; padding: 14px; background: var(--surface); border-radius: var(--radius); margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .alert-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .alert-dot.crit { background: var(--danger); }
  .alert-dot.warn { background: var(--warning); }
  .alert-body h3 { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .alert-body .desc { font-size: 12px; color: var(--muted); }
  .alert-body .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  /* Inspection cards */
  .inspect-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .inspect-card { min-width: 150px; background: var(--surface); border-radius: var(--radius); padding: 16px; text-align: center; }
  .inspect-card .big-num { font-size: 32px; font-weight: 400; font-family: 'Roboto', sans-serif; }
  .inspect-card .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }
  /* Bottom Nav (Material) */
  .bottom-nav { position: sticky; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--border); padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0)); max-width: 430px; margin: 0 auto; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); border: none; background: none; cursor: pointer; padding: 6px 4px; }
  .nav-item.active { color: var(--blue); }
  .nav-item .nav-icon { font-size: 22px; }
  .nav-item .nav-ripple { position: relative; }
</style>
</head>
<body>
  <div class="status-bar"><span>10:08</span><span style="display:flex;gap:4px">▮▮▮▮ · Wi-Fi · 🔋▮▮</span></div>
  <div class="top-bar">
    <div class="row">
      <div>
        <h1>泽雷特运维</h1>
        <div class="site-tag">香河数据中心 · A1机房</div>
      </div>
      <div class="avatar">👤</div>
    </div>
  </div>

  <div class="stat-chips">
    <div class="chip"><div class="num" style="color:var(--danger)">3</div><div class="label">严重告警</div></div>
    <div class="chip"><div class="num" style="color:var(--warning)">7</div><div class="label">警告</div></div>
    <div class="chip"><div class="num" style="color:var(--info)">12</div><div class="label">提示</div></div>
    <div class="chip"><div class="num" style="color:var(--success)">146</div><div class="label">设备在线</div></div>
  </div>

  <div class="actions">
    <div class="action-chip"><span class="icon">🔔</span> 告警中心</div>
    <div class="action-chip"><span class="icon">🔍</span> 设备巡检</div>
    <div class="action-chip"><span class="icon">📋</span> 工单管理</div>
    <div class="action-chip"><span class="icon">📦</span> 产品中心</div>
  </div>

  <div class="section">
    <div class="section-title">最近告警</div>
    <div class="alert-card">
      <div class="alert-dot crit"></div>
      <div class="alert-body">
        <h3>A3机柜温度过高</h3>
        <div class="desc">当前温度 38.5°C，超过阈值 35°C</div>
        <div class="meta">10分钟前 · A3-12号柜</div>
      </div>
    </div>
    <div class="alert-card">
      <div class="alert-dot warn"></div>
      <div class="alert-body">
        <h3>UPS电池电压偏低</h3>
        <div class="desc">2号UPS电池组电压 192V，低于正常值</div>
        <div class="meta">28分钟前 · 配电间B</div>
      </div>
    </div>
    <div class="alert-card">
      <div class="alert-dot" style="background:var(--info)"></div>
      <div class="alert-body">
        <h3>巡检任务到期提醒</h3>
        <div class="desc">A区精密空调季度巡检今日截止</div>
        <div class="meta">1小时前 · A区空调组</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">今日巡检</div>
    <div class="inspect-row">
      <div class="inspect-card"><div class="big-num" style="color:var(--success)">8</div><div class="lbl">已完成</div></div>
      <div class="inspect-card"><div class="big-num" style="color:var(--warning)">3</div><div class="lbl">进行中</div></div>
      <div class="inspect-card"><div class="big-num" style="color:var(--muted)">5</div><div class="lbl">待开始</div></div>
    </div>
  </div>

  <!-- Bottom Nav (Material 3 style) -->
  <nav class="bottom-nav">
    <button class="nav-item active"><span class="nav-icon">🏠</span>首页</button>
    <button class="nav-item"><span class="nav-icon">🔔</span>告警</button>
    <button class="nav-item"><span class="nav-icon">📋</span>工单</button>
    <button class="nav-item"><span class="nav-icon">📦</span>产品</button>
    <button class="nav-item"><span class="nav-icon">👤</span>我的</button>
  </nav>
</body>
</html>
