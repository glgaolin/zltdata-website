<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>泽雷特 · 运维Dashboard</title>
<style>
  :root {
    --blue: #0D47A1;
    --cyan: #27C3C4;
    --dark: #142824;
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --fg: #1A1A2E;
    --muted: #6B7280;
    --border: #E5E7EB;
    --danger: #E53935;
    --warning: #FB8C00;
    --success: #43A047;
    --info: #1E88E5;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  /* Status Bar */
  .status-bar {
    display: flex; justify-content: space-between;
    padding: 14px 24px 8px; font-size: 12px; font-weight: 600;
    background: var(--blue); color: #fff;
  }
  /* Header */
  .header {
    background: linear-gradient(135deg, var(--blue) 0%, #0A3880 100%);
    padding: 20px 24px 32px; color: #fff; border-radius: 0 0 20px 20px;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .header-top h1 { font-size: 22px; font-weight: 700; }
  .header-avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-size: 20px; }
  .header-sub { font-size: 13px; opacity: .8; }
  /* Stat Cards Row */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 24px; margin-top: -20px; }
  .stat-card { background: var(--surface); border-radius: var(--radius); padding: 14px 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .stat-card .num { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat-card .label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat-card.danger .num { color: var(--danger); }
  .stat-card.warning .num { color: var(--warning); }
  .stat-card.info .num { color: var(--info); }
  .stat-card.success .num { color: var(--success); }
  /* Quick Actions */
  .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px 24px; }
  .qa-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px; background: var(--surface); border-radius: var(--radius); border: none; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.04); transition: transform .15s; }
  .qa-btn:active { transform: scale(.95); }
  .qa-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; }
  .qa-icon.alarm { background: #FFEBEE; }
  .qa-icon.inspect { background: #E8F5E9; }
  .qa-icon.ticket { background: #E3F2FD; }
  .qa-icon.product { background: #F3E5F5; }
  .qa-label { font-size: 12px; color: var(--fg); font-weight: 600; }
  /* Section */
  .section { padding: 8px 24px 20px; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .section-title .more { font-size: 13px; color: var(--cyan); font-weight: 500; }
  /* Alert List */
  .alert-item { display: flex; gap: 12px; padding: 14px; background: var(--surface); border-radius: var(--radius); margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .alert-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .alert-dot.danger { background: var(--danger); box-shadow: 0 0 6px rgba(229,57,53,.5); }
  .alert-dot.warning { background: var(--warning); box-shadow: 0 0 6px rgba(251,140,0,.5); }
  .alert-dot.info { background: var(--info); }
  .alert-body { flex: 1; min-width: 0; }
  .alert-body .title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .alert-body .desc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alert-body .meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 12px; }
  /* Bottom Tab Bar */
  .tab-bar {
    position: sticky; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-around; align-items: center;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0));
    max-width: 430px; margin: 0 auto;
  }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); border: none; background: none; cursor: pointer; padding: 4px 12px; }
  .tab-item.active { color: var(--blue); }
  .tab-icon { font-size: 22px; }
  /* Pulse animation for active alarm */
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .pulse { animation: pulse 2s infinite; }
</style>
</head>
<body>
  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span style="display:flex;gap:6px">●●●●○</span>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div>
        <h1>泽雷特运维</h1>
        <div class="header-sub">香河数据中心 · A1机房</div>
      </div>
      <div class="header-avatar">👤</div>
    </div>
  </div>

  <!-- Stat Row -->
  <div class="stat-row">
    <div class="stat-card danger">
      <div class="num"><span class="pulse">3</span></div>
      <div class="label">严重告警</div>
    </div>
    <div class="stat-card warning">
      <div class="num">7</div>
      <div class="label">警告</div>
    </div>
    <div class="stat-card info">
      <div class="num">12</div>
      <div class="label">提示</div>
    </div>
    <div class="stat-card success">
      <div class="num">146</div>
      <div class="label">设备在线</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="quick-actions">
    <button class="qa-btn" onclick="location.href='screens_ios-alarms.html'">
      <div class="qa-icon alarm">🔔</div>
      <span class="qa-label">告警中心</span>
    </button>
    <button class="qa-btn" onclick="location.href='screens_ios-inspection.html'">
      <div class="qa-icon inspect">🔍</div>
      <span class="qa-label">设备巡检</span>
    </button>
    <button class="qa-btn" onclick="location.href='screens_ios-tickets.html'">
      <div class="qa-icon ticket">📋</div>
      <span class="qa-label">工单管理</span>
    </button>
    <button class="qa-btn" onclick="location.href='screens_ios-products.html'">
      <div class="qa-icon product">📦</div>
      <span class="qa-label">产品中心</span>
    </button>
  </div>

  <!-- Recent Alarms -->
  <div class="section">
    <div class="section-title">
      最新告警
      <span class="more">查看全部 →</span>
    </div>
    <div class="alert-item">
      <div class="alert-dot danger"></div>
      <div class="alert-body">
        <div class="title">A3机柜温度过高</div>
        <div class="desc">当前温度 38.5°C，超过阈值 35°C</div>
        <div class="meta"><span>🕐 10分钟前</span><span>📍 A3-12号柜</span></div>
      </div>
    </div>
    <div class="alert-item">
      <div class="alert-dot warning"></div>
      <div class="alert-body">
        <div class="title">UPS电池电压偏低</div>
        <div class="desc">2号UPS电池组电压 192V，低于正常值 210V</div>
        <div class="meta"><span>🕐 28分钟前</span><span>📍 配电间B</span></div>
      </div>
    </div>
    <div class="alert-item">
      <div class="alert-dot info"></div>
      <div class="alert-body">
        <div class="title">巡检任务到期提醒</div>
        <div class="desc">A区精密空调季度巡检今日截止</div>
        <div class="meta"><span>🕐 1小时前</span><span>📍 A区空调组</span></div>
      </div>
    </div>
  </div>

  <!-- Today's Inspection -->
  <div class="section">
    <div class="section-title">
      今日巡检
      <span class="more">全部 →</span>
    </div>
    <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch">
      <div style="min-width:140px;background:var(--surface);border-radius:var(--radius);padding:14px;text-align:center">
        <div style="font-size:28px;font-weight:800;color:var(--success)">8</div>
        <div style="font-size:11px;color:var(--muted)">已完成</div>
      </div>
      <div style="min-width:140px;background:var(--surface);border-radius:var(--radius);padding:14px;text-align:center">
        <div style="font-size:28px;font-weight:800;color:var(--warning)">3</div>
        <div style="font-size:11px;color:var(--muted)">进行中</div>
      </div>
      <div style="min-width:140px;background:var(--surface);border-radius:var(--radius);padding:14px;text-align:center">
        <div style="font-size:28px;font-weight:800;color:var(--muted)">5</div>
        <div style="font-size:11px;color:var(--muted)">待开始</div>
      </div>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-item active" onclick="location.href='screens_ios-dashboard.html'">
      <span class="tab-icon">🏠</span> 首页
    </button>
    <button class="tab-item" onclick="location.href='screens_ios-alarms.html'">
      <span class="tab-icon">🔔</span> 告警
    </button>
    <button class="tab-item" onclick="location.href='screens_ios-tickets.html'">
      <span class="tab-icon">📋</span> 工单
    </button>
    <button class="tab-item" onclick="location.href='screens_ios-products.html'">
      <span class="tab-icon">📦</span> 产品
    </button>
    <button class="tab-item" onclick="location.href='screens_ios-profile.html'">
      <span class="tab-icon">👤</span> 我的
    </button>
  </nav>
</body>
</html>
