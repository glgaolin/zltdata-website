<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>泽雷特 · 告警中心 Android</title>
<style>
  :root {
    --blue: #0D47A1; --cyan: #27C3C4; --dark: #142824;
    --bg: #F4F6F8; --surface: #FFFFFF; --fg: #1A1A2E;
    --muted: #6B7280; --border: #E5E7EB;
    --danger: #E53935; --warning: #FB8C00; --success: #43A047; --info: #1E88E5;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', 'Noto Sans SC', system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    max-width: 430px; margin: 0 auto; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .status-bar { display: flex; justify-content: space-between; padding: 10px 20px 6px; font-size: 12px; background: var(--dark); color: #fff; }
  .top-bar { background: var(--blue); color: #fff; padding: 4px 16px 12px; border-radius: 0 0 16px 16px; display: flex; align-items: center; gap: 12px; }
  .top-bar .back { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 20px; display: grid; place-items: center; cursor: pointer; }
  .top-bar h1 { font-size: 18px; font-weight: 500; }
  /* Chips filter */
  .filter-chips { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
  .filter-chip { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; }
  .filter-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  /* Alarm list */
  .alarm-list { padding: 0 16px 16px; }
  .alarm-card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06); border-left: 4px solid transparent; }
  .alarm-card.crit { border-left-color: var(--danger); }
  .alarm-card.warn { border-left-color: var(--warning); }
  .alarm-card.info { border-left-color: var(--info); }
  .alarm-card .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .alarm-card .tag { padding: 2px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .tag.crit { background: #FFEBEE; color: var(--danger); }
  .tag.warn { background: #FFF3E0; color: var(--warning); }
  .tag.info { background: #E3F2FD; color: var(--info); }
  .alarm-card .time { font-size: 11px; color: var(--muted); }
  .alarm-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .alarm-card .desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
  .alarm-card .meta { font-size: 11px; color: var(--muted); display: flex; gap: 12px; }
  .alarm-card .btn-row { margin-top: 10px; display: flex; gap: 8px; }
  .alarm-card .btn { padding: 6px 16px; border-radius: 20px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: .5px; }
  .btn-filled { background: var(--blue); color: #fff; }
  .btn-tonal { background: var(--border); color: var(--fg); }
  /* Bottom Nav */
  .bottom-nav { position: sticky; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--border); padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0)); max-width: 430px; margin: 0 auto; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); border: none; background: none; cursor: pointer; padding: 6px 4px; }
  .nav-item.active { color: var(--blue); }
  .nav-icon { font-size: 22px; }
</style>
</head>
<body>
  <div class="status-bar"><span>10:08</span><span style="display:flex;gap:4px">▮▮▮▮ · Wi-Fi · 🔋▮▮</span></div>
  <div class="top-bar">
    <button class="back" onclick="history.back()">←</button>
    <h1>告警中心</h1>
  </div>

  <div class="filter-chips">
    <div class="filter-chip active" onclick="filterClick(this)">全部 (22)</div>
    <div class="filter-chip" onclick="filterClick(this)">严重 (3)</div>
    <div class="filter-chip" onclick="filterClick(this)">警告 (7)</div>
    <div class="filter-chip" onclick="filterClick(this)">提示 (12)</div>
    <div class="filter-chip" onclick="filterClick(this)">已处理</div>
  </div>

  <div class="alarm-list">
    <div class="alarm-card crit">
      <div class="row"><span class="tag crit">严重</span><span class="time">10分钟前</span></div>
      <h3>A3机柜温度过高</h3>
      <div class="desc">当前温度 38.5°C，超过安全阈值 35°C。可能原因：空调送风不足或设备负载过高。</div>
      <div class="meta"><span>📍 A3-12号柜</span><span>🖥️ DELL R740xd</span></div>
      <div class="btn-row"><button class="btn btn-filled">处理</button></div>
    </div>
    <div class="alarm-card crit">
      <div class="row"><span class="tag crit">严重</span><span class="time">22分钟前</span></div>
      <h3>B区精密空调停机</h3>
      <div class="desc">2号精密空调已停止运行，B区温度正在上升。</div>
      <div class="meta"><span>📍 B区空调间</span><span>🏭 Liebert PEX4</span></div>
      <div class="btn-row"><button class="btn btn-filled">处理</button></div>
    </div>
    <div class="alarm-card warn">
      <div class="row"><span class="tag warn">警告</span><span class="time">28分钟前</span></div>
      <h3>UPS电池电压偏低</h3>
      <div class="desc">2号UPS电池组电压 192V，低于正常工作范围 210-230V。</div>
      <div class="meta"><span>📍 配电间B</span><span>🔋 2号UPS</span></div>
      <div class="btn-row"><button class="btn btn-tonal">确认</button></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item"><span class="nav-icon">🏠</span>首页</button>
    <button class="nav-item active"><span class="nav-icon">🔔</span>告警</button>
    <button class="nav-item"><span class="nav-icon">📋</span>工单</button>
    <button class="nav-item"><span class="nav-icon">📦</span>产品</button>
    <button class="nav-item"><span class="nav-icon">👤</span>我的</button>
  </nav>
  <script>
    function filterClick(el) {
      el.parentElement.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }
  </script>
</body>
</html>
